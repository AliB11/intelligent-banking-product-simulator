name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Engine, database, API, browser, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: راه‌اندازی Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci

      - name: همگام‌سازی schema روی PostgreSQL آزمایشی
        run: npx drizzle-kit push

      - name: Engine and API regression tests
        run: npm test

      - name: Database revision, concurrency and persistence tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: ESLint
        run: npm run lint

      - name: تولید typeهای Next.js
        run: npx next typegen

      - name: بررسی TypeScript
        run: npm exec tsc -- --noEmit --pretty false

      - name: ساخت production
        run: npm run build

      - name: بررسی سلامت برنامه و API محصولات
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 > /tmp/simorgh-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/simorgh-health.json; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/simorgh-next.log
            echo "Production server did not become healthy" >&2
            exit 1
          fi

          node -e 'const h=require("/tmp/simorgh-health.json"); if (!h.ok) process.exit(1); console.log("health: ok")'
          curl --fail --silent http://127.0.0.1:3000/api/products > /tmp/simorgh-products.json
          node -e 'const p=require("/tmp/simorgh-products.json"); if (!Array.isArray(p.items) || p.items.length < 1) process.exit(1); console.log(`products: ${p.items.length}`)'

          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run test:smoke
          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run test:browser
